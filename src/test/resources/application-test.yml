spring:
  config:
    activate:
      on-profile: test

  cache:
    type: none

  datasource:
    url: jdbc:h2:mem:~/assignment
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        hbm2ddl:
          auto: create-drop
    open-in-view: false

jwt:
  secret: testSecretKeyForJwtWhichIsAtLeast32Bytes~~~
  accessTokenExpiration: 3600000
  refreshTokenExpiration: 604800000

